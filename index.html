<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Answer Company : Agentic Branch — 잠금</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>/* 오피스 토큰 정본 — 회사가 내보내는 모든 화면(대시보드·잠금 화면)이 이 한 벌을 쓴다.
   사본을 두지 않는다: dash.css·gate.css 에는 :root 블록도 값 리터럴도 없다.
   scripts/check-contrast.mjs 가 이 파일에서 값을 읽어 대비를 계산하고, 다른 파일의 리터럴을 실패시킨다. */
:root{
  /* 글자 — 크기 6단계(11·12·14·16·24·32) · 행간 4px 격자 · 웨이트 3 */
  --fs-display:32px;  --lh-display:40px;
  --fs-h1:24px;       --lh-h1:32px;
  --fs-h2:16px;       --lh-h2:24px;
  --fs-body:14px;     --lh-body:22px;
  --fs-label:12px;    --lh-label:16px;
  --fs-badge:11px;    --lh-badge:16px;
  --ls-display:-.02em;  --ls-h1:-.01em;
  --w-reg:400;  --w-med:600;  --w-bold:700;
  --font:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Segoe UI","Malgun Gothic",sans-serif;

  /* 글자 색 — 두 단계 + 비활성 하나(텍스트 금지) */
  --ink:#f4f1f7;
  --ink-2:rgba(244,241,247,.76);
  --ink-disabled:rgba(244,241,247,.48);

  /* 표면 — 자두빛 바탕 위 불투명 카드(대비가 결정적), 유리는 크롬에만, 중첩 깊이 1 */
  --bg-0:#160d1c;
  --surface:rgba(34,18,40,.92);
  --surface-2:rgba(255,255,255,.05);
  --surface-3:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.12);
  --line-2:rgba(255,255,255,.22);
  --code-bg:rgba(0,0,0,.28);
  --bar:rgba(255,255,255,.35);       /* 차트 채움 — 색이 아니라 밝기로 양을 보인다 */
  --side:rgba(10,7,16,.55);
  --blur:18px;

  /* 의미색 둘 — 파랑은 행동·진행(주 버튼·링크·작업 중·미터), 주황은 사람이 봐야 하는 것(사람 차례·확인 필요).
     승인·완료는 색이 아니라 체크 아이콘, 실패·반려는 X 아이콘 + 글자만 로즈(--bad).
     로즈 채움은 딱 한 곳만 쓴다(2026-09-13) — 마감을 넘겼는데 제출하지 않은 프로젝트 카드.
     다른 신호는 되돌릴 수 있지만 이건 되돌릴 수 없어서, 훑을 때 다른 카드와 섞이면 안 된다.
     그 밖의 자리에서는 여전히 채움·테두리에 로즈를 쓰지 않는다. */
  --accent:#265ff0;  --accent-h:#4d82ff;  --accent-ink:#9dbbff;
  --accent-bg:rgba(47,107,255,.18);  --accent-line:rgba(47,107,255,.45);
  --warn:#ffb454;  --warn-bg:rgba(255,180,84,.16);  --warn-line:rgba(255,180,84,.45);
  --bad:#ff5d7a;  --bad-bg:rgba(255,93,122,.13);  --bad-line:rgba(255,93,122,.38);

  /* 간격·반경·폭 — 그룹 밖(24) > 그룹 안(20) */
  --pad-card:20px;  --gap-card:24px;  --measure:720px;  --side-w:300px;
  --r-card:12px;  --r-sm:8px;  --r-xs:4px;  --r-pill:999px;
}
@media(max-width:1000px){:root{--pad-card:16px}}
@media(max-width:560px){:root{--fs-display:28px;--lh-display:36px;--fs-h1:20px;--lh-h1:28px}}
/* 잠금 화면 배치 (gate.css) — 값은 여기에 없다. lib/office/tokens.css 의 토큰을 그대로 쓴다.
   대시보드와 같은 자를 써야 하므로 :root 블록도 리터럴 글자 값도 두지 않는다.
   lib/office-crypt.ts 가 tokens.css 와 이 파일을 <style> 하나로 인라인한다. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--ink)}
body{font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh-body);display:flex;align-items:center;justify-content:center;
  padding:24px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1100px 700px at 12% -8%, rgba(78,30,96,.85) 0%, transparent 60%),
  radial-gradient(900px 700px at 105% 105%, rgba(178,54,122,.70) 0%, transparent 55%),var(--bg-0)}
/* 박스 없이 배경 위에 로고 + 밑줄 입력칸만(피드백 2026-09-06). 잠금 해제는 Enter */
.gate{position:relative;z-index:1;width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column}
/* 로고 없을 때만 이름 폴백 */
.gate .t{font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:var(--w-bold);letter-spacing:var(--ls-h1);margin:0 0 24px;text-wrap:balance;text-align:center}
/* 로고 — 검은 아트(투명 배경)라 흰색으로 반전, 가운데 */
.gate .logo{display:block;margin:0 auto 44px;width:100%;max-width:260px;height:auto;filter:brightness(0) invert(1)}
.nb{white-space:nowrap}
/* 밑줄형 입력 — 배경·테두리 없이 아래 선만. 16px 미만이면 폰이 확대하므로 --fs-h2 */
input{width:100%;font-family:var(--font);font-size:var(--fs-h2);line-height:var(--lh-h2);padding:12px 4px;
  border:0;border-bottom:2px solid var(--line-2);border-radius:0;background:transparent;color:var(--ink);outline:none;transition:border-color .16s}
input::placeholder{color:var(--ink-2)}
input:focus{border-bottom-color:var(--accent-h)}
/* 버튼은 감춘다 — Enter 로 연다(gate.js 가 폼 제출을 받는다) */
button{display:none}
.st{min-height:1.4em;margin-top:16px;text-align:center;font-size:var(--fs-label);line-height:var(--lh-label);color:var(--ink-2)}
.st.err{color:var(--bad);font-weight:var(--w-med)}
/* 자연스러운 등장 — 로고·입력·상태가 살짝 떠오른다. 모션 최소화면 끈다 */
@keyframes o-gate-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.gate .logo{animation:o-gate-in .5s .05s both ease-out}
.gate input{animation:o-gate-in .5s .18s both ease-out}
.gate .st{animation:o-gate-in .5s .3s both ease-out}
body{transition:opacity .2s ease}   /* 잠금 해제 때 gate.js 가 페이드아웃 후 문서를 바꾼다 */
@media(prefers-reduced-motion:reduce){.gate .logo,.gate input,.gate .st{animation:none}body{transition:none}}
</style>
</head>

<script>// @ts-check
/* 오피스 비밀번호 게이트 (gate.js)
   페이로드(PBKDF2-SHA256 + AES-256-GCM)를 WebCrypto 로 복호해 문서를 통째로 바꿔 끼운다.
   틀린 비밀번호는 GCM 태그 불일치(OperationError)로 잡힌다 — 아무것도 렌더하지 않는다. */
(function () {
  'use strict';
  var payloadEl = document.getElementById('nara-office-payload');
  var form = /** @type {HTMLFormElement|null} */ (document.getElementById('gate-form'));
  var input = /** @type {HTMLInputElement|null} */ (document.getElementById('gate-pw'));
  var btn = /** @type {HTMLButtonElement|null} */ (document.getElementById('gate-btn'));
  var status = document.getElementById('gate-status');
  if (!payloadEl || !form || !input || !btn || !status) return;

  /** @param {string} msg @param {boolean=} err */
  function say(msg, err) { status.textContent = msg; status.className = 'st' + (err ? ' err' : ''); }

  var p;
  try { p = JSON.parse(payloadEl.textContent || '{}'); } catch (e) { say('페이로드를 읽지 못했습니다.', true); return; }
  if (!p || p.v !== 1 || p.kdf !== 'pbkdf2-sha256') { say('지원하지 않는 페이로드 형식입니다.', true); return; }

  if (!(window.crypto && window.crypto.subtle)) {
    say('이 주소에서는 열 수 없습니다. https 또는 localhost 로 여십시오.', true);
    btn.disabled = true; return;
  }
  if (p.gz && typeof DecompressionStream === 'undefined') {
    say('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome·Edge·Safari·Firefox 로 여십시오.', true);
    btn.disabled = true; return;
  }

  /** base64 → 실제 ArrayBuffer 기반 Uint8Array (WebCrypto 의 BufferSource 요건)
   * @param {string} s @returns {Uint8Array<ArrayBuffer>} */
  function b64(s) { var bin = atob(s); var a = new Uint8Array(new ArrayBuffer(bin.length)); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = (input.value || '').normalize('NFC');
    if (!pw) { say('비밀번호를 입력하십시오.', true); return; }
    btn.disabled = true; say('확인 중…');
    var t0 = performance.now();
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, key, b64(p.ct)); })
      .then(function (pt) {
        if (p.gz) { return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
        return new TextDecoder().decode(pt);
      })
      .then(function (html) {
        try { console.info('office: 복호 ' + Math.round(performance.now() - t0) + 'ms'); } catch (e) { /* 무시 */ }
        function swap() { document.open(); document.write(html); document.close(); }
        // 자연스러운 전환 — 게이트를 페이드아웃한 뒤 대시보드로 바꾼다(대시보드는 제 페이드인으로 뜬다)
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) { swap(); return; }
        document.body.style.opacity = '0';
        setTimeout(swap, 200);
      })
      .catch(function (err) {
        say('비밀번호가 맞지 않습니다.', true);
        btn.disabled = false; input.select();
        try { console.warn('office: ' + (err && err.name)); } catch (e) { /* 무시 */ }
      });
  });
})();
</script>
